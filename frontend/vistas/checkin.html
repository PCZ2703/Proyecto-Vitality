<html lang="es">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/estilos.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#4A7C59;">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="../index.html">Vitalia Connect</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="checkin.html">Checkins</a></li>
                    <li class="nav-item"><a class="nav-link" href="cajaMensual.html">Cajas Mensuales</a></li>
                    <li class="nav-item"><a class="nav-link" href="calificacion.html">Calificaciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="producto.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="sesion.html">Sesiones</a></li>
                    <li class="nav-item"><a class="nav-link" href="suscripcion.html">Suscripciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="terapeuta.html">Terapeutas</a></li>
                    <li class="nav-item"><a class="nav-link" href="usuario.html">Usuarios</a></li>
                    <li class="nav-item"><a class="nav-link" href="soporteTicket.html">Soporte</a></li>
                    <li class="nav-item"><a class="nav-link" href="envioLogistica.html">Envios</a></li>
                    <li class="nav-item"><a class="nav-link" href="notificacion.html">Notificaciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="pago.html">Pagos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fw-bold" style="color:#2C3E2D;">Checkins de Bienestar</h2>
            <button type="button" class="btn btn-success rounded-3" data-bs-toggle="modal" data-bs-target="#modalCheckin">
                + Nuevo Checkin
            </button>
        </div>

        <div id="alertaCheckin"></div>

        <div class="table-responsive shadow-sm rounded-3">
            <table class="table table-hover align-middle bg-white">
                <thead style="background-color:#A3C9A8;">
                    <tr>
                        <th>Usuario</th>
                        <th>Energia</th>
                        <th>Sueno</th>
                        <th>Digestion</th>
                        <th>Animo</th>
                        <th>Fecha</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaCheckin">
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="modalCheckin" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content rounded-3">
                <form id="formCheckin">
                    <div class="modal-header" style="background-color:#4A7C59;">
                        <h5 class="modal-title text-white" id="tituloModalCheckin">Nuevo Checkin</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="checkinId">

                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <input type="text" class="form-control" id="checkinUsuario" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nivel de Energia (1-10)</label>
                            <input type="number" min="1" max="10" class="form-control" id="checkinEnergia" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Calidad de Sueno (1-10)</label>
                            <input type="number" min="1" max="10" class="form-control" id="checkinSueno" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Digestion (1-10)</label>
                            <input type="number" min="1" max="10" class="form-control" id="checkinDigestion" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Animo (1-10)</label>
                            <input type="number" min="1" max="10" class="form-control" id="checkinAnimo" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success" id="btnGuardarCheckin">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/modelos/CheckinModel.js"></script>
    <script src="../js/checkin.js"></script>
</body>
</html>
