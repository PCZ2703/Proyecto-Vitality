<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitalia Connect - Productos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/estilos.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#4A7C59;">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="../index.html">Vitalia Connect</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="checkin.html">Checkins</a></li>
                    <li class="nav-item"><a class="nav-link" href="cajaMensual.html">Cajas Mensuales</a></li>
                    <li class="nav-item"><a class="nav-link" href="calificacion.html">Calificaciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="producto.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="sesion.html">Sesiones</a></li>
                    <li class="nav-item"><a class="nav-link" href="soporteTicket.html">Soporte</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fw-bold" style="color:#2C3E2D;">Productos</h2>
            <button type="button" class="btn btn-success rounded-3" data-bs-toggle="modal" data-bs-target="#modalProducto">
                + Nuevo Producto
            </button>
        </div>

        <div id="alertaProducto"></div>

        <div class="table-responsive shadow-sm rounded-3">
            <table class="table table-hover align-middle bg-white">
                <thead style="background-color:#A3C9A8;">
                    <tr>
                        <th>Nombre</th>
                        <th>Tipo</th>
                        <th>Ingredientes</th>
                        <th>Beneficios</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaProducto"></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="modalProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content rounded-3">
                <form id="formProducto">
                    <div class="modal-header" style="background-color:#4A7C59;">
                        <h5 class="modal-title text-white" id="tituloModalProducto">Nuevo Producto</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="productoId">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="productoNombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tipo</label>
                            <select class="form-select" id="productoTipo" required>
                                <option value="">Seleccione...</option>
                                <option value="Capsula">Capsula</option>
                                <option value="Infusion">Infusion</option>
                                <option value="Gota">Gota</option>
                                <option value="Shampoo">Shampoo</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ingredientes (separados por coma)</label>
                            <input type="text" class="form-control" id="productoIngredientes" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Beneficios (separados por coma)</label>
                            <input type="text" class="form-control" id="productoBeneficios" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Stock</label>
                            <input type="number" min="0" class="form-control" id="productoStock" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/modelos/ProductoModel.js"></script>
    <script src="../js/producto.js"></script>
</body>
</html>
