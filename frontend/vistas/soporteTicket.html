        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="../index.html">Vitalia Connect</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="checkin.html">Checkins</a></li>
                    <li class="nav-item"><a class="nav-link" href="cajaMensual.html">Cajas Mensuales</a></li>

                </ul>
            </div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fw-bold" style="color:#2C3E2D;">Tickets de Soporte</h2>
            <button type="button" class="btn btn-success rounded-3" data-bs-toggle="modal" data-bs-target="#modalSoporteTicket">
                + Nuevo Ticket
            </button>
        </div>

        <div id="alertaSoporteTicket"></div>

        <div class="table-responsive shadow-sm rounded-3">
            <table class="table table-hover align-middle bg-white">
                <thead style="background-color:#A3C9A8;">
                    <tr>
                        <th>Usuario</th>
                        <th>Asunto</th>
                        <th>Mensaje</th>
                        <th>Estado</th>
                        <th>Respuesta</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaSoporteTicket"></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="modalSoporteTicket" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content rounded-3">
                <form id="formSoporteTicket">
                    <div class="modal-header" style="background-color:#4A7C59;">
                        <h5 class="modal-title text-white" id="tituloModalSoporteTicket">Nuevo Ticket</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="soporteTicketId">

                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <input type="text" class="form-control" id="soporteTicketUsuario" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Asunto</label>
                            <input type="text" class="form-control" id="soporteTicketAsunto" placeholder="Ej: No llego mi caja de agosto" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mensaje</label>
                            <textarea class="form-control" id="soporteTicketMensaje" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Estado</label>
                            <select class="form-select" id="soporteTicketEstado" required>
                                <option value="">Seleccione...</option>
                                <option value="Abierto">Abierto</option>
                                <option value="En proceso">En proceso</option>
                                <option value="Resuelto">Resuelto</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Respuesta</label>
                            <textarea class="form-control" id="soporteTicketRespuesta" rows="2" placeholder="Respuesta del equipo de soporte"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/modelos/SoporteTicketModel.js"></script>
    <script src="../js/soporteTicket.js"></script>
</body>
</html>
