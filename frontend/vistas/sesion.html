<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/estilos.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#4A7C59;">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="../index.html">Vitalia Connect</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="checkin.html">Checkins</a></li>
                    <li class="nav-item"><a class="nav-link" href="cajaMensual.html">Cajas Mensuales</a></li>
                    <li class="nav-item"><a class="nav-link" href="calificacion.html">Calificaciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="producto.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="sesion.html">Sesiones</a></li>
                    <li class="nav-item"><a class="nav-link" href="suscripcion.html">Suscripciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="terapeuta.html">Terapeutas</a></li>
                    <li class="nav-item"><a class="nav-link" href="usuario.html">Usuarios</a></li>
                    <li class="nav-item"><a class="nav-link" href="soporteTicket.html">Soporte</a></li>
                    <li class="nav-item"><a class="nav-link" href="envioLogistica.html">Envios</a></li>
                    <li class="nav-item"><a class="nav-link" href="notificacion.html">Notificaciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="pago.html">Pagos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fw-bold" style="color:#2C3E2D;">Sesiones</h2>
            <button type="button" class="btn btn-success rounded-3" data-bs-toggle="modal" data-bs-target="#modalSesion">
                + Nueva Sesion
            </button>
        </div>

        <div id="alertaSesion"></div>

        <div class="table-responsive shadow-sm rounded-3">
            <table class="table table-hover align-middle bg-white">
                <thead style="background-color:#A3C9A8;">
                    <tr>
                        <th>Cliente</th>
                        <th>Terapeuta</th>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Notas</th>
                        <th>Recomendaciones</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaSesion"></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="modalSesion" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content rounded-3">
                <form id="formSesion">
                    <div class="modal-header" style="background-color:#4A7C59;">
                        <h5 class="modal-title text-white" id="tituloModalSesion">Nueva Sesion</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="sesionId">

                        <div class="mb-3">
                            <label class="form-label">Cliente</label>
                            <input type="text" class="form-control" id="sesionCliente" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Terapeuta</label>
                            <input type="text" class="form-control" id="sesionTerapeuta" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fecha</label>
                            <input type="date" class="form-control" id="sesionFecha" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Hora</label>
                            <input type="time" class="form-control" id="sesionHora" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Notas</label>
                            <textarea class="form-control" id="sesionNotas" rows="2" placeholder="Ej: Cliente reporta mejor descanso"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Recomendaciones</label>
                            <textarea class="form-control" id="sesionRecomendaciones" rows="2" placeholder="Ej: Infusion de valeriana antes de dormir"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/modelos/SesionModel.js"></script>
    <script src="../js/sesion.js"></script>
</body>
</html>
